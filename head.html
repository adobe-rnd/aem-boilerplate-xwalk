<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  var extJs = 'js';
  var extCss = 'css';
  function getMetadata(name, doc = document) {
    const attr = name && name.includes(":") ? "property" : "name";
    const meta = [...doc.head.querySelectorAll(`meta[${attr}="${name}"]`)]
      .map((m) => m.content)
      .join(", ");
    return meta || "";
  }
  function getExtension(type) {
    const isMinify = getMetadata("minify") === "true";
    // const isMinify = false
    if (type === "js") {
      return isMinify ? `.min.${extJs}` : `.${extJs}`;
    } else if (type === "css") {
      return isMinify ? `.min.${extCss}` : `.${extCss}`;
    }
  }
</script>

<style>
  body {
    opacity: 0;
  }

  body.appear {
    opacity: 1;
  }
</style>

<script>
  // Start loading the main styles straight away, in parallel with the scripts.
  // scripts.js waits for window.stylesLoaded before showing the page.
  window.stylesLoaded = new Promise((resolve) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `/styles/styles${getExtension('css')}`;
    link.onload = resolve;
    link.onerror = resolve; // show the page even if the styles fail
    document.head.append(link);
  });
</script>

<script>
  // SEO: tell search engines this page is English (India), with x-default pointing to the same page.
  // Only added on the page's own canonical URL (not on copies whose canonical points elsewhere).
  (function addHreflang() {
    const canonical = document.querySelector('link[rel="canonical"]');
    if (!canonical || new URL(canonical.href).pathname !== window.location.pathname) return;
    // Skip the regional language folders (currently English copies, not real translations)
    if (/^\/(hi|gu|mr|ta|te|kn|ml)(\/|$)/.test(window.location.pathname)) return;
    ['en-in', 'x-default'].forEach((lang) => {
      const link = document.createElement('link');
      link.rel = 'alternate';
      link.hreflang = lang;
      link.href = canonical.href;
      document.head.append(link);
    });
  }());
</script>

sitemaps:
  example:
    default: en # adds the x-default alternate to English pages
    lastmod: YYYY-MM-DD  # date format; value comes from the lastModified column of the query index, refreshed on every publish
    languages:
      en:
        source: /query-master.json
        destination: /en/sitemap-index.xml
        hreflang: en-in
      # Regional languages (hi, gu, mr, ta, te, kn, ml) removed until real translated pages exist.
      # They were English copies; listing them as hreflang alternates is wrong for SEO.
